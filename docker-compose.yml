version: '3.8'
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.1
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.5.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      - kafka

  marketdata-service:
    build:
      context: .
      dockerfile: marketdata-service/Dockerfile
    ports:
      - "8082:8082"
    depends_on:
      - kafka

  fix-connector-service:
    build:
      context: .
      dockerfile: fix-connector-service/Dockerfile
    ports:
      - "8083:8083"
    depends_on:
      - kafka

  blotter-service:
      build:
        context: .
        dockerfile: blotter-service/Dockerfile
      ports:
        - "8084:8084"
      depends_on:
        - kafka

